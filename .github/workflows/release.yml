name: Release

on:
  push:
    tags:
      - "v*"
  # A manual run creates the tag itself (on the commit the run is started
  # on, with the workflow's own token) and then releases it with the same
  # checks, suite, zip and GitHub release as a tag push. A tag pushed with
  # GITHUB_TOKEN starts no second run, so this run does the release.
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release (must equal extension/manifest.json); the tag is v<version>"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full commit SHA (supply-chain hardening); the comment names
      # the release. persist-credentials: false keeps the GITHUB_TOKEN out of
      # .git/config, so the npm step below cannot read it (the gh release step
      # uses GH_TOKEN from the env instead).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # TAG is the pushed tag, or v<version> for a manual run.
      - name: Name the tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="v${INPUT_VERSION}"
          else
            tag="$GITHUB_REF_NAME"
          fi
          case "$tag" in v[0-9]*) ;; *) echo "not a release tag: $tag" >&2; exit 1 ;; esac
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Check that the tag matches the manifest version
        run: |
          version=$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' extension/manifest.json | head -1)
          tag="${TAG#v}"
          if [ "$version" != "$tag" ]; then
            echo "manifest version $version does not match tag $TAG" >&2
            exit 1
          fi

      # Manual run only: the tag is created on the commit this run checked
      # out and pushed with the workflow's token; an existing tag fails here.
      - name: Create the tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists on the remote" >&2
            exit 1
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG"

      # The release body is the tag's section of CHANGELOG.md; a tag without
      # a section fails here, before anything is built.
      - name: Extract the release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      # jsdom 30 (extension/test/package.json) runs on Node 22.22+ or 24.15+;
      # Node 20 fails at require time (undici's markAsUncloneable).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # Install from the committed lockfile (npm ci), so the release builds the
      # exact dependency tree the repository pins and runs no resolution.
      - name: Install the test dependencies
        run: cd extension/test && npm ci --no-audit --no-fund

      # The offline suite must pass before anything is built. The recon dumps
      # are not in the repository, so the dump-based checks skip here;
      # MGC_ALLOW_SKIP=1 accepts those skips and nothing else (a failed check
      # still fails the release). run.sh prints which suites were reduced.
      - name: Run the offline test suite (dump-based checks reduced)
        run: MGC_ALLOW_SKIP=1 sh extension/test/run.sh

      # The dump-independent suites never skip, so CI proves them in full:
      # a non-zero exit fails the step; a suite that prints no "CHECKS PASSED"
      # summary line fails it (an await that never resolved, or a harness
      # edited to drop its finish: the harness exit hooks catch that too,
      # but the wrapper does not rely on them); and a non-zero "skipped"
      # count in the summary fails it (both harnesses print the
      # "(N passed, N failed, N skipped)" shape, so the count check is never
      # vacuous).
      - name: Prove the dump-independent suites in full (no skips allowed)
        run: |
          cd extension/test
          for t in deep-link.cjs progress.cjs worker-harness.mjs ui-pages.cjs; do
            if out=$(node "$t" 2>&1); then rc=0; else rc=$?; fi
            printf '%s\n' "$out"
            if [ "$rc" != 0 ]; then echo "FAIL: $t exited $rc" >&2; exit 1; fi
            printf '%s\n' "$out" | grep -q "CHECKS PASSED (" || { echo "FAIL: $t printed no summary line" >&2; exit 1; }
            skipped=$(printf '%s\n' "$out" | sed -n 's/.*, \([0-9][0-9]*\) skipped.*/\1/p' | tail -n 1)
            if [ -z "$skipped" ]; then echo "FAIL: $t printed no skipped count in its summary line" >&2; exit 1; fi
            if [ "$skipped" != 0 ]; then
              echo "FAIL: $t skipped $skipped check(s); the dump-independent suites must run in full" >&2
              exit 1
            fi
          done

      - name: Build the extension zip
        run: sh scripts/build-extension-zip.sh

      - name: Create the GitHub release and attach the zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" dist/model-garden-clicker-*.zip \
            --title "$TAG" \
            --notes-file release-notes.md
