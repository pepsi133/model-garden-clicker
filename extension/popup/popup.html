<!DOCTYPE html>
<html lang="en" class="popup">
<head>
  <meta charset="utf-8">
  <title>Model Garden Clicker</title>
  <link rel="stylesheet" href="../common/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img class="photo" src="../icons/avatar96.png" alt="">
    <div class="title">
      <h1>Model Garden Clicker</h1>
      <div class="toggles">
        <button type="button" id="mode" class="mode dry" role="switch" aria-checked="false"><span class="track" aria-hidden="true"><span class="knob"></span></span>MODE: DRY RUN</button>
        <button type="button" id="step-toggle" class="step-toggle" role="switch" aria-checked="true">
          <span class="track" aria-hidden="true"><span class="knob"></span></span>
          <svg id="icon-snail" class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="display: none">
            <circle cx="15" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="2"/>
            <circle cx="15" cy="11" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M2 18.5c0-2.5 2-4.5 4.5-4.5H9v5H3.5A1.5 1.5 0 0 1 2 18.5z" fill="currentColor"/>
            <path d="M5.5 14l-1.5-4.5M7.5 14l1-4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="3.8" cy="9" r="1.1" fill="currentColor"/>
            <circle cx="8.8" cy="9" r="1.1" fill="currentColor"/>
            <path d="M9 19.5h13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <svg id="icon-warning" class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M12 2.5L22.5 20.5H1.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="M12 9v5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            <circle cx="12" cy="17" r="1.3" fill="currentColor"/>
          </svg>
          <span id="step-toggle-label">fast mode</span>
        </button>
      </div>
    </div>
    <div class="header-actions">
      <div class="header-links">
        <a href="#" id="runs" title="Open the Runs page: every run's full log, to read, download or delete">Runs</a>
        <a href="#" id="open-tab" title="Open this page in a normal tab, where it can grow beyond the popup's 600 px">Open in a tab</a>
      </div>
      <button type="button" id="options">Options</button>
    </div>
  </header>

  <div class="inputs">
    <div id="link-banner" class="link-banner" hidden><span id="link-text"></span> <button type="button" id="link-clear" title="Empty the project IDs, the model selection and the extra slugs that the link filled in">Clear</button></div>
    <section class="fixed">
      <label for="projects">Project IDs, one per line</label>
      <textarea id="projects" rows="3" spellcheck="false" placeholder="my-project-id"></textarea>
    </section>

    <section class="models-section">
      <div class="row">
        <label>Models</label>
        <span class="links"><a href="#" id="models-all">all</a> · <a href="#" id="models-none">none</a> · <a href="#" id="models-latest" title="newest GA model of each line (opus, sonnet, haiku, fable)">latest</a></span>
      </div>
      <div id="models" class="models"></div>
      <div id="pairs" class="pairs"></div>
      <div id="models-note" class="models-note" hidden></div>
      <label for="extra-models">Extra model slugs, comma or newline separated</label>
      <input id="extra-models" type="text" spellcheck="false" placeholder="claude-opus-4-6">
      <label><input type="checkbox" id="include-done"> Include pairs already done or skipped in earlier runs</label>
      <label title="A dry run that only reads each model page: an enabled model ends skipped, a model with the Enable button offered (or the &quot;Enable APIs&quot; dialog) ends not-enabled. Nothing is clicked, the dialog's Enable included. Spent by the next Start; refused in FULL RUN."><input type="checkbox" id="check-only"> Check only: read whether each model is enabled; click nothing</label>
    </section>

    <div id="missing" class="missing" hidden></div>

    <section class="controls fixed">
      <button id="start" class="primary">Start</button>
      <button id="stop">Stop</button>
      <button id="pause" type="button" hidden title="Pause the run at the next job boundary: the job in progress finishes, the next one does not start until Resume">Pause</button>
    </section>

    <div id="status" class="status">idle</div>
    <div id="step" class="step" hidden></div>
    <div id="error" class="error" hidden></div>
  </div>

  <div class="scroll">
    <section>
      <div class="row">
        <label>Results</label>
        <span class="links"><a href="#" id="clear-results">clear</a></span>
      </div>
      <div id="summary" class="summary" hidden></div>
      <table id="results">
        <thead><tr><th>Project</th><th>Model</th><th>Status</th><th>Message</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <details id="log-details">
      <summary>Log (last 50 lines)</summary>
      <pre id="log"></pre>
    </details>
  </div>

  <script src="../common/constants.js"></script>
  <script src="popup.js"></script>
</body>
</html>
